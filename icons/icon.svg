<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Neon Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>

    <!-- Neon Gold Glow -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Danger Spike Gradient -->
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#990022"/>
    </linearGradient>

    <!-- Filter for drop shadow / glow -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Icon Container (Apple Touch Icon / PWA Maskable) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#cyanGlow)" stroke-width="6" opacity="0.85"/>
  <rect x="26" y="26" width="460" height="460" rx="88" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.3"/>

  <!-- Subtle Cyber Grid Background -->
  <path d="M60 128 H452 M60 256 H452 M60 384 H452 M128 60 V452 M256 60 V452 M384 60 V452" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Troll Spikes on the sides / floor (Game Essence) -->
  <polygon points="120,410 145,360 170,410" fill="url(#spikeGrad)" stroke="#110005" stroke-width="3"/>
  <polygon points="342,410 367,360 392,410" fill="url(#spikeGrad)" stroke="#110005" stroke-width="3"/>

  <!-- Grass Platform block under character -->
  <rect x="140" y="392" width="232" height="32" rx="6" fill="#1b4d24" stroke="#0f2b14" stroke-width="3"/>
  <rect x="140" y="392" width="232" height="10" rx="4" fill="#00e676"/>
  <rect x="144" y="394" width="224" height="2" fill="#b9f6ca"/>

  <!-- Character / Hero Head (The Iconic Boy / Ninja with Scarf) -->
  <!-- Ninja Scarf (Cyan Wind) -->
  <path d="M210 240 Q170 245 130 220 Q160 260 215 255 Z" fill="#00e5ff" filter="url(#neonFilter)"/>
  <path d="M205 248 Q150 260 110 242 Q150 280 210 262 Z" fill="#00b0ff"/>

  <!-- Character Head Base -->
  <rect x="206" y="168" width="100" height="96" rx="28" fill="#181818" stroke="#000000" stroke-width="5"/>
  
  <!-- Face Opening -->
  <rect x="228" y="196" width="74" height="38" rx="12" fill="#ffd0a0" stroke="#000" stroke-width="3"/>
  
  <!-- Fierce Eyes -->
  <rect x="244" y="206" width="14" height="16" rx="4" fill="#ffffff"/>
  <rect x="274" y="206" width="14" height="16" rx="4" fill="#ffffff"/>
  <rect x="250" y="208" width="8" height="12" rx="3" fill="#00e5ff"/>
  <rect x="280" y="208" width="8" height="12" rx="3" fill="#00e5ff"/>
  <rect x="254" y="210" width="3" height="4" rx="1" fill="#05101a"/>
  <rect x="284" y="210" width="3" height="4" rx="1" fill="#05101a"/>
  
  <!-- Headband with Metallic Plate -->
  <rect x="202" y="174" width="108" height="20" rx="6" fill="#00b0ff" stroke="#000" stroke-width="2.5"/>
  <rect x="236" y="177" width="40" height="14" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <circle cx="242" cy="184" r="1.5" fill="#006064"/>
  <circle cx="270" cy="184" r="1.5" fill="#006064"/>

  <!-- Character Body / Robe -->
  <rect x="220" y="260" width="72" height="76" rx="14" fill="#222222" stroke="#000" stroke-width="4"/>
  <rect x="214" y="306" width="84" height="14" rx="4" fill="#00e5ff" stroke="#000" stroke-width="2.5"/>

  <!-- Legs -->
  <rect x="228" y="332" width="22" height="62" rx="8" fill="#181818" stroke="#000" stroke-width="3.5"/>
  <rect x="262" y="332" width="22" height="62" rx="8" fill="#262626" stroke="#000" stroke-width="3.5"/>
  <rect x="222" y="378" width="30" height="18" rx="6" fill="#0a0a0a"/>
  <rect x="260" y="378" width="30" height="18" rx="6" fill="#141414"/>

  <!-- Floating Golden Star Coin -->
  <g transform="translate(366, 150)" filter="url(#strongGlow)">
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" stroke="#b8860b" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#fff8b3" stroke-width="2" opacity="0.8"/>
    <!-- Star Stamp inside coin -->
    <polygon points="0,-18 5,-5 19,-4 8,6 12,19 0,11 -12,19 -8,6 -19,-4 -5,-5" fill="#e69500"/>
    <polygon points="0,-14 4,-4 15,-3 6,5 9,15 0,9 -9,15 -6,5 -15,-3 -4,-4" fill="#fff59d"/>
  </g>

  <!-- Glowing Game Title / Acronym -->
  <text x="256" y="470" text-anchor="middle" font-family="'Press Start 2P', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="2" filter="url(#neonFilter)">GIVAP FREND</text>
  <text x="256" y="470" text-anchor="middle" font-family="'Press Start 2P', system-ui, sans-serif" font-weight="900" font-size="28" fill="#00e5ff" letter-spacing="2">GIVAP FREND</text>

  <!-- Red Heart Extra Life Icon in top corner -->
  <g transform="translate(96, 120)" filter="url(#neonFilter)">
    <path d="M0,8 A8,8 0 0,1 16,8 A8,8 0 0,1 32,8 Q32,20 16,30 Q0,20 0,8 Z" fill="#ff1744" stroke="#8a001a" stroke-width="2"/>
    <circle cx="8" cy="7" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
